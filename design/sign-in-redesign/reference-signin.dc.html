.body{flex:1;min-width:0;display:flex;flex-direction:column;padding:22px 20px 20px}

.btn:hover:not(:disabled){background:var(--accent-hover)}

.btn.is-loading:disabled{background:var(--accent);color:var(--on-accent);cursor:progress}

.w-main{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero{position:relative;width:128px;height:128px}
.w-tile{width:128px;height:128px;border-radius:28px;display:block;background:var(--rp);box-shadow:0 0 0 4px var(--rc)}
.w-title{margin:40px 0 0;font-family:Archivo,sans-serif;font-weight:700;font-size:24px;line-height:1.2;letter-spacing:-0.01em;text-wrap:balance}
.w-sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.stamp{position:absolute;right:-46px;bottom:-4px;padding:3px 10px;border:3px solid var(--bright-ink);border-radius:6px;background:var(--sun);color:var(--bright-ink);font-family:Archivo,sans-serif;font-weight:700;font-size:15px;line-height:1.2;letter-spacing:0.14em;transform:rotate(-8deg)}
.signout{flex:none;min-height:44px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-family:inherit;font-size:15px;text-decoration:underline;cursor:pointer}
.signout:hover{color:var(--ink)}
@keyframes jq-bar{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@keyframes jq-shimmer{from{transform:translateX(-130%) skewX(-20deg)}to{transform:translateX(380%) skewX(-20deg)}}
@keyframes jq-pole{to{transform:translateX(17px)}}
@media (prefers-reduced-motion: reduce){.jq *,.jq *::before,.jq *::after{animation:none !important;transition:none !important}.btn.is-loading::after{width:100%;opacity:.35}.band.is-checking::after{display:none}}

</helmet>
<div class="{{rootCls}}" data-theme="{{theme}}">
<header class="top">
<a class="back" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Back to team view</a>
<button type="button" class="icon-btn" onClick="{{onTheme}}" aria-label="{{themeLabel}}">
<sc-if value="{{light}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
<sc-if value="{{dark}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></sc-if>
</button>
</header>
<main class="stage">
<div class="pwrap">
<section class="pass" aria-labelledby="jq-title">
<div class="{{bandCls}}">
<span class="slot" aria-hidden="true"></span>
<span class="bx b1" aria-hidden="true"></span>
<span class="bx b2" aria-hidden="true"></span>
<span class="bx b3" aria-hidden="true"></span>
<span class="bx b4" aria-hidden="true"></span>
<span class="bx b5" aria-hidden="true"></span>
<span class="bx b6" aria-hidden="true"></span>
<span class="bx b7" aria-hidden="true"></span>
<div class="band-top">
<div class="brand">
<span class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 7h14M5 12h10M5 17h6"></path></svg></span>
<span>Judge Queue</span>
</div>
<div class="role">{{roleWord}}</div>
</div>
<sc-if value="{{staff}}" hint-placeholder-val="{{ true }}">
<div class="crew">
<div class="mate">
<span class="tile r-judge">
<img class="av-img" src="/avatars/judge.jpg" alt="" width="44" height="44">
</span>
<span class="mate-l">Judge</span>
</div>
<div class="mate">
<span class="tile r-desk">
<img class="av-img" src="/avatars/queue-desk.jpg" alt="" width="44" height="44">
</span>
<span class="mate-l">Queue desk</span>
</div>
<div class="mate">
<span class="tile r-ja">
<img class="av-img" src="/avatars/judge-advisor.jpg" alt="" width="44" height="44">
</span>
<span class="mate-l">Judge Advisor</span>
</div>
</div>
</sc-if>
<sc-if value="{{referee}}" hint-placeholder-val="{{ false }}">
<div class="solo">
<span class="tile tile--solo r-ref">
<img class="av-img" src="/avatars/referee.jpg" alt="" width="60" height="60">
</span>
<span class="solo-l">Referee</span>
</div>
<span class="stripes" aria-hidden="true"></span>
</sc-if>
</div>
<div class="body">
<sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
<h1 class="title" id="jq-title">{{title}}</h1>
<p class="intro">{{intro}}</p>
<form class="form" onSubmit="{{onSubmit}}">
<div class="field">
<label class="label" for="jq-code">Access code</label>
<input id="jq-code" class="{{codeInputCls}}" type="text" value="{{code}}" onChange="{{onCode}}" placeholder="ABC123" maxLength="32" autoComplete="one-time-code" autoCapitalize="characters" autoCorrect="off" spellCheck="false" enterKeyHint="next" aria-invalid="{{codeInvalid}}" aria-describedby="{{codeDescribedBy}}" disabled="{{loading}}">
<sc-if value="{{badCode}}" hint-placeholder-val="{{ false }}">
<div class="alert" role="alert" id="jq-error"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg><span>That code is not recognised. Check it and try again.</span></div>
</sc-if>
<sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
<div class="alert" role="alert" id="jq-error"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>Too many attempts — wait 2 minutes, then try again.</span></div>
</sc-if>
</div>
<div class="field">
<label class="label" for="jq-name"><span>Your name</span><span class="tag">{{nameTag}}</span></label>
<input id="jq-name" class="input" type="text" value="{{name}}" onChange="{{onName}}" autoComplete="name" autoCapitalize="words" enterKeyHint="go" aria-describedby="jq-name-help" aria-required="{{nameRequired}}" disabled="{{loading}}">
<p class="help" id="jq-name-help">{{nameHelp}}</p>
</div>
<div class="actions">
<button type="submit" class="{{btnCls}}" disabled="{{btnDisabled}}" aria-busy="{{busy}}">
<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><span>Checking…</span></sc-if>
<sc-if value="{{idle}}" hint-placeholder-val="{{ true }}"><span>Sign in</span></sc-if>
</button>
</div>
</form>
</sc-if>
<sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
<div class="{{welcomeCls}}">
<div class="w-main">
<div class="hero">
<div class="w-tile">
<sc-if value="{{roleJudge}}" hint-placeholder-val="{{ true }}">
<img class="av-img" src="/avatars/judge.jpg" alt="" width="128" height="128">
</sc-if>
<sc-if value="{{roleDesk}}" hint-placeholder-val="{{ false }}">
<img class="av-img" src="/avatars/queue-desk.jpg" alt="" width="128" height="128">
</sc-if>
<sc-if value="{{roleJa}}" hint-placeholder-val="{{ false }}">
<img class="av-img" src="/avatars/judge-advisor.jpg" alt="" width="128" height="128">
</sc-if>
<sc-if value="{{roleRef}}" hint-placeholder-val="{{ false }}">
<img class="av-img" src="/avatars/referee.jpg" alt="" width="128" height="128">
</sc-if>
</div>
<span class="stamp" aria-hidden="true">VERIFIED</span>
</div>
<div class="w-text" role="status">
<h1 class="w-title" id="jq-title">{{welcomeTitle}}</h1>
<p class="w-sub">Opening the queue…</p>
</div>
</div>
<button type="button" class="signout" onClick="{{onSignOut}}">Not you? Sign out</button>
</div>
</sc-if>
</div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["staff","referee"],"default":"staff"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"device":{"editor":"enum","options":["mobile","wide"],"default":"mobile"},"start":{"editor":"enum","options":["empty","noname","ready","loading","error","locked","success"],"default":"ready"},"role":{"editor":"enum","options":["judge","desk","ja"],"default":"judge"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this.timer); }
  renderVals() {
    const PRESETS = {
      empty: { code: '', name: '', phase: 'idle' },
      noname: { code: 'ABC123', name: '', phase: 'idle' },
      ready: { code: 'ABC123', name: 'Jordan Lee', phase: 'idle' },
      loading: { code: 'ABC123', name: 'Jordan Lee', phase: 'loading' },
      error: { code: 'QRT482LMN9', name: 'Jordan Lee', phase: 'error' },
      locked: { code: 'QRT482LMN9', name: 'Jordan Lee', phase: 'locked' },
      success: { code: 'JA0001', name: 'Jordan Lee', phase: 'ok' }
    };
    const ROLES = { judge: 'Judge', desk: 'Queue desk', ja: 'Judge Advisor', ref: 'Referee' };
    const STAFF_CODES = { JUDGE1: 'judge', DESK01: 'desk', JA0001: 'ja', ABC123: 'judge' };
    const REF_CODES = { REF001: 'ref', ABC123: 'ref' };
    const p = this.props;
    const s = this.state || {};
    const preset = PRESETS[p.start ?? 'ready'] || PRESETS.ready;
    const referee = (p.variant ?? 'staff') === 'referee';
    const code = s.code ?? preset.code;
    const name = s.name ?? preset.name;
    const phase = s.phase ?? preset.phase;
    const theme = s.theme ?? p.theme ?? 'light';
    const role = referee ? 'ref' : (s.role ?? p.role ?? 'judge');
    const loading = phase === 'loading';
    const locked = phase === 'locked';
    const ok = phase === 'ok';
    const complete = code.length >= 1 && (!referee || name.trim() !== '');
    return {
      theme,
      rootCls: 'jq' + ((p.device ?? 'mobile') === 'wide' ? ' jq--wide' : ''),
      light: theme !== 'dark',
      dark: theme === 'dark',
      themeLabel: theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme',
      bandCls: 'band' + (referee ? ' band--ref' : '') + (loading ? ' is-checking' : ''),
      staff: !referee,
      referee,
      roleWord: referee ? 'Referee' : 'Staff',
      title: referee ? 'Referee sign in' : 'Staff sign in',
      intro: referee
        ? 'Referees sign in here to record flags during matches.'
        : 'For judges, queue staff and Judge Advisors. Teams do not need to sign in.',
      nameTag: referee ? 'Required' : 'Optional',
      nameHelp: referee
        ? 'Every flag you file is recorded under this name. Use your full name.'
        : 'Shown to the Judge Advisor on the activity log.',
      nameRequired: referee ? 'true' : 'false',
      showForm: !ok,
      ok,
      roleJudge: role === 'judge',
      roleDesk: role === 'desk',
      roleJa: role === 'ja',
      roleRef: role === 'ref',
      welcomeCls: 'welcome r-' + role,
      welcomeTitle: 'Signed in as ' + ROLES[role],
      code,
      name,
      loading,
      locked,
      idle: !loading,
      badCode: phase === 'error',
      codeInputCls: 'code-input' + (phase === 'error' ? ' code-input--error' : ''),
      codeInvalid: phase === 'error' ? 'true' : 'false',
      codeDescribedBy: phase === 'error' || locked ? 'jq-error' : undefined,
      btnCls: 'btn' + (loading ? ' is-loading' : ''),
      btnDisabled: !complete || loading || locked || ok,
      busy: loading ? 'true' : 'false',
      onCode: (e) => this.setState({
        code: e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 32),
        phase: locked ? 'locked' : 'idle'
      }),
      onName: (e) => this.setState({ name: e.target.value }),
      onTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' }),
      onSignOut: () => {
        clearTimeout(this.timer);
        this.setState({ phase: 'idle', code: '', name: '', tries: 0, role: null });
      },
      onSubmit: (e) => {
        e.preventDefault();
        if (!complete || loading || locked || ok) return;
        this.setState({ phase: 'loading' });
        clearTimeout(this.timer);
        this.timer = setTimeout(() => {
          const tries = ((this.state && this.state.tries) || 0) + 1;
          const hit = (referee ? REF_CODES : STAFF_CODES)[code];
          if (hit) {
            this.setState({ phase: 'ok', tries: 0, role: hit });
            return;
          }
          this.setState({ phase: tries >= 3 ? 'locked' : 'error', tries });
        }, 1200);
      }
    };
  }
}
</script>
</body>
</html>
