<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Referee report · match first · dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=Fira+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit}
.jq{--canvas:oklch(0.165 0.012 265);--surface:oklch(0.205 0.014 265);--ink:oklch(0.955 0.005 265);--muted:oklch(0.670 0.013 265);--line:oklch(0.320 0.016 265);--accent:oklch(0.680 0.140 258);--on-accent:oklch(0.165 0.012 265);--ring:oklch(0.680 0.140 258 / 0.35);--field:oklch(0.180 0.013 265);--field-line:oklch(0.520 0.014 265);--ref:oklch(0.760 0.150 55);--ref-tint:oklch(0.760 0.150 55 / 0.15);--good:oklch(0.745 0.140 158);--warn:oklch(0.790 0.150 82);--minor:oklch(0.735 0.185 58);--major:oklch(0.640 0.200 18);--dq:oklch(0.300 0.010 265);--dq-line:oklch(0.440 0.020 265);--sev-ink:oklch(0.165 0.012 265);--caution-bg:oklch(0.790 0.150 82 / 0.12);--caution-line:oklch(0.790 0.150 82 / 0.35);--caution-ink:oklch(0.840 0.100 82);position:relative;box-sizing:border-box;width:375px;height:912px;overflow:hidden;display:flex;flex-direction:column;background:var(--canvas);color:var(--ink);font-family:'Fira Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.jq *,.jq *::before,.jq *::after{box-sizing:border-box}
.jq :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 14px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{flex:none;width:28px;height:28px;display:block}
.av img{display:block;width:100%;height:100%;object-fit:cover;border-radius:22%;box-shadow:0 0 0 2px var(--ref)}
.who-t{display:flex;flex-direction:column;line-height:1.15}
.who-t b{font-family:Archivo,sans-serif;font-weight:700;font-size:16px}
.who-t span{font-size:12px;color:var(--muted)}
.top-r{display:flex;align-items:center;gap:2px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--good)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.signout{min-height:44px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer}
.strip{display:block;flex:none;height:6px;background:repeating-linear-gradient(135deg,oklch(0.985 0.003 265) 0 6px,oklch(0.180 0.012 265) 6px 12px)}
.tabs{flex:none;height:64px;display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tab{position:relative;flex:1;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:500}
.tab[aria-current]{color:var(--ref)}
.tab[aria-current]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ref)}
.lab{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font-weight:500;font-size:15px;line-height:1.3}
.tag{font-size:13px;font-weight:400;color:var(--muted)}
.input{height:48px;width:100%;margin:0;border:1.5px solid var(--field-line);border-radius:12px;background:var(--field);color:var(--ink);padding:0 14px;font-family:inherit;font-size:16px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.input::placeholder{color:var(--muted);opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:56px;height:44px;padding:0 12px;border:1.5px solid var(--field-line);border-radius:12px;background:var(--field);color:var(--ink);font-family:Archivo,sans-serif;font-weight:600;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:4px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:500;font-size:15px}
.row small{display:inline;margin-left:6px;font-weight:400;font-size:12px;color:var(--muted)}
.sw{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:48px;height:28px;margin:0;border-radius:14px;background:var(--field);border:1.5px solid var(--field-line);cursor:pointer}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--muted)}
.sw:checked{background:var(--accent);border-color:var(--accent)}
.sw:checked::before{left:22px;background:var(--on-accent)}
.caution{display:flex;gap:10px;align-items:flex-start;padding:7px 12px;border-radius:12px;background:var(--caution-bg);border:1px solid var(--caution-line);color:var(--caution-ink);font-size:14px;line-height:1.4}
.caution svg{flex:none;margin-top:1px}
.caution p{margin:0}
.caution b{font-weight:500;color:var(--warn)}
.s-good{--c:var(--good);--ci:var(--sev-ink)}
.s-warn{--c:var(--warn);--ci:var(--sev-ink)}
.s-minor{--c:var(--minor);--ci:var(--sev-ink)}
.s-major{--c:var(--major);--ci:oklch(0.985 0.010 18)}
.s-dq{--c:var(--dq);--ci:oklch(0.955 0.005 265);--cb:var(--dq-line)}
.sv{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 8px;border:1px solid var(--cb,var(--c));border-radius:12px;background:var(--c);color:var(--ci);font-family:Archivo,sans-serif;font-weight:600;font-size:16px;cursor:pointer}
.sv svg{flex:none}
.sv[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.sev{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sev .s-dq{grid-column:1 / -1}
.prim{width:100%;height:52px;border:1px solid var(--cb,var(--c));border-radius:12px;background:var(--c);color:var(--ci);font-family:Archivo,sans-serif;font-weight:700;font-size:17px;cursor:pointer}
.mbar{flex:none;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.mm{display:flex;flex-direction:column;line-height:1;margin-right:4px}
.mm span{margin-bottom:3px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mm b{font-family:Archivo,sans-serif;font-weight:700;font-size:28px;line-height:1;letter-spacing:-.01em}
.mchip{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:8px;background:var(--ref-tint);color:var(--ref);font-weight:500;font-size:13px;white-space:nowrap}
.ptag{display:inline-flex;align-items:center;height:24px;padding:0 7px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.04em;white-space:nowrap}
.chg{margin-left:auto;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1.5px solid var(--field-line);border-radius:12px;background:transparent;font-size:14px;font-weight:500;cursor:pointer}
.body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px 16px 14px}
.body>*{flex:none}
.big{height:52px;padding:0 16px;font-family:Archivo,sans-serif;font-weight:700;font-size:32px;letter-spacing:.08em;text-transform:uppercase}
.dd{display:flex;align-items:center;gap:8px;width:100%;height:48px;margin-top:8px;padding:0 12px 0 14px;border:1.5px solid var(--field-line);border-radius:12px;background:var(--field);color:var(--ink);font-size:15px;font-weight:500;text-align:left;cursor:pointer}
.dd .dl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd .dl em{font-style:normal;font-weight:400;font-size:13px;color:var(--muted)}
.dd .cnt{flex:none;padding:2px 9px;border-radius:999px;background:var(--ring);color:var(--ink);font-size:12px;font-weight:500}
.dd svg{flex:none;color:var(--muted)}
.tline{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--muted)}
.flag{margin-left:auto;padding:3px 10px;border-radius:999px;background:var(--caution-bg);border:1px solid var(--caution-line);color:var(--caution-ink);font-size:12px;font-weight:500;white-space:nowrap}
.note{border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.note summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;font-weight:500;font-size:15px;cursor:pointer;list-style:none}
.note summary::-webkit-details-marker{display:none}
.abar{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
</style>
</helmet>
<div class="jq" data-theme="dark">
<header class="top">
<div class="who"><span class="av"><img src="/avatars/referee.jpg" alt="" width="28" height="28"></span><span class="who-t"><b>Referee</b><span>Jordan Lee</span></span></div>

</header>
<div class="strip" aria-hidden="true"></div>
<section class="mbar" aria-label="Current match">

<span class="mchip">Field 2</span>
<span class="ptag">V5RC</span>

</div>
